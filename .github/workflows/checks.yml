name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: node --input-type=module --check < src/stillwatch/resources/extension/extension.js
      - run: node tests/test_extension.mjs
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-x11
      - run: dbus-run-session -- /usr/bin/python3 tests/gui_constructor.py
      - run: python -m pip install build
      - run: python -m build
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - run: python3 scripts/build_android.py --sdk "$ANDROID_HOME" --java "$JAVA_HOME"
